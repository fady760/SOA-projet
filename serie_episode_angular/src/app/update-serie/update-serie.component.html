<form>
  <div [hidden]="ajout" class="mb-3">
    <label class="form-label">ID Série</label>
    <input readonly type="text" [(ngModel)]="serie.idSerie" name="idSerie" class="form-control w-25">
  </div>
  <div class="mb-3">
    <label class="form-label">Titre Série</label>
    <input type="text" [(ngModel)]="serie.titre" name="titreSerie" class="form-control" placeholder="Entrez un titre de série...">
  </div>
  <div class="mb-3">
    <label class="form-label">Genre</label>
    <input type="text" [(ngModel)]="serie.genre" name="genreSerie" class="form-control" placeholder="Entrez un genre...">
  </div>
  <div class="mb-3">
    <label class="form-label">Année Début</label>
    <input type="number" [(ngModel)]="serie.anneeDebut" name="anneeDebut" class="form-control" placeholder="Année...">
  </div>
  <div class="mt-2">
    <button type="button" [disabled]="!serie.titre" class="btn btn-success" (click)="saveSerie()">
      {{ajout ? 'Ajouter' : 'Modifier'}}
    </button>
  </div>
</form>
