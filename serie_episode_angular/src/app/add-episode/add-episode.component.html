<div class="container mt-4">
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <h5 class="m-0 font-weight-bold text-primary">Ajouter un Épisode :</h5>
    </div>
    <div class="card-body">
      <form>
        <div class="row">
          <div class="col-sm-6 col-md-6 mb-3">
            <label class="form-label">Titre Épisode</label>
            <input type="text" [(ngModel)]="newEpisode.titreEpisode" name="titreEpisode" class="form-control">
          </div>
          <div class="col-sm-3 col-md-3 mb-3">
            <label class="form-label">Numéro Épisode</label>
            <input type="number" [(ngModel)]="newEpisode.numeroEpisode" name="numeroEpisode" class="form-control">
          </div>
          <div class="col-sm-3 col-md-3 mb-3">
            <label class="form-label">Saison</label>
            <input type="number" [(ngModel)]="newEpisode.saison" name="saison" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-sm-4 col-md-4 mb-3">
            <label class="form-label">Durée (min)</label>
            <input type="number" step="0.5" [(ngModel)]="newEpisode.duree" name="duree" class="form-control">
          </div>
          <div class="col-sm-8 col-md-8 mb-3">
            <label class="form-label">Série</label>
            <select class="form-select" id="idSerie" name="idSerie" [(ngModel)]="newIdSerie">
              @for (serie of series; track serie.idSerie) {
                <option [value]="serie.idSerie">{{ serie.titre }}</option>
              }
            </select>
          </div>
        </div>

        <div class="mt-2">
          <button type="button" (click)="addEpisode()" class="btn btn-success">Ajouter</button>
        </div>
      </form>
    </div>
  </div>
</div>
